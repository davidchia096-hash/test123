name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write # lets the job publish the APK as a release download

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests and build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: MockGPS-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # A fixed download link: https://github.com/<owner>/<repo>/releases/download/mockgps-latest/MockGPS.apk
      - name: Publish APK to the "mockgps-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MockGPS.apk
          gh release delete mockgps-latest --yes --cleanup-tag || true
          gh release create mockgps-latest MockGPS.apk \
            --target "$GITHUB_SHA" \
            --title "Mock GPS (latest build)" \
            --notes "Debug build of commit ${GITHUB_SHA::7}. Install MockGPS.apk on your phone, then pick Mock GPS under Developer options > Select mock location app."
